name: Gerar EXE do Loja do Zero

on:

  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Gerar executável
        run: |
          pyinstaller --onefile --windowed --name "LojaDoZero" main.py

      - name: Enviar EXE como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LojaDoZero-Windows
          path: dist/LojaDoZero.exe
```
