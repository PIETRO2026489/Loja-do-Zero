```yaml
name: Gerar EXE do Loja do Zero

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Verificar arquivo principal
        run: |
          if (!(Test-Path "main.py")) {
            Write-Host "ERRO: main.py não foi encontrado."
            exit 1
          }

      - name: Verificar sintaxe
        run: |
          python -m py_compile main.py

      - name: Gerar executável
        run: |
          pyinstaller --onefile --windowed --name LojaDoZero main.py

      - name: Verificar executável
        run: |
          if (!(Test-Path "dist/LojaDoZero.exe")) {
            Write-Host "ERRO: LojaDoZero.exe não foi criado."
            exit 1
          }

      - name: Publicar executável
        uses: actions/upload-artifact@v4
        with:
          name: LojaDoZero-Windows
          path: dist/LojaDoZero.exe
```
