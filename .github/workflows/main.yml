
name: Gerar EXE do Loja do Zero

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pygame e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Gerar EXE
        run: |
          pyinstaller --onefile --windowed --name LojaDoZero main.py

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: LojaDoZero-Windows
          path: dist/LojaDoZero.exe
```
