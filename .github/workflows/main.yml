
name: Gerar EXE do Loja do Zero

on:

  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar Pygame e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Verificar jogo
        run: |
          python -m py_compile jogo.py

      - name: Criar EXE
        run: |
          pyinstaller --onefile --windowed --name LojaDoZero jogo.py

      - name: Enviar EXE
        uses: actions/upload-artifact@v4
        with:
          name: LojaDoZero-Windows
          path: dist/LojaDoZero.exe
